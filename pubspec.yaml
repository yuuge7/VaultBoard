name: vaultboard
description: "VaultBoard — an offline-first, local-only Kanban board for desktop."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Offline-first local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  file_selector_platform_interface: ^2.7.0

flutter:
  uses-material-design: true

# Runs on every push to main: builds distro packages (.deb, .rpm, pacman
# .pkg.tar.zst, portable tar.gz) and a Windows zip, then publishes a GitHub
# release tagged from the version in pubspec.yaml. If that tag already exists
# (main pushed again without a version bump), a unique -build.N tag is used so
# every push still produces a release.
name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Compute version & tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Read version from pubspec.yaml
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            TAG="$TAG-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION as $TAG"

  linux-packages:
    name: Linux packages (deb, rpm, pacman, tar.gz)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build & packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build libgtk-3-dev \
            rpm zstd libarchive-tools librsvg2-bin \
            ruby ruby-dev build-essential
          sudo gem install fpm --no-document

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build packages
        run: |
          flutter pub get
          bash packaging/linux/build_packages.sh "${{ needs.prepare.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*

  windows-build:
    name: Windows zip
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build
        run: |
          flutter pub get
          flutter build windows --release

      - name: Zip bundle
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "vaultboard-$version-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: vaultboard-*-windows-x64.zip

  release:
    name: Publish GitHub release
    needs: [prepare, linux-packages, windows-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: VaultBoard ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: artifacts/**

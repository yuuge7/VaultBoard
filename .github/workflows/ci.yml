# Runs on every push to any branch except main (development branches) and on
# pull requests targeting main: analyze + test, then build downloadable
# debug-channel bundles for Linux and Windows.
name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-linux:
    name: Build Linux bundle
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build
        run: |
          flutter pub get
          flutter build linux --release

      - name: Archive bundle
        run: tar -C build/linux/x64/release/bundle -czf vaultboard-linux-x64-dev.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: vaultboard-linux-x64-dev
          path: vaultboard-linux-x64-dev.tar.gz
          retention-days: 14

  build-windows:
    name: Build Windows bundle
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build
        run: |
          flutter pub get
          flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: vaultboard-windows-x64-dev
          path: build/windows/x64/runner/Release
          retention-days: 14
